services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sincrohub
      POSTGRES_PASSWORD: sincrohub
      POSTGRES_DB: sincrohub
    ports:
      - "5432:5432"
    volumes:
      - sincrohub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sincrohub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - sincrohub_redis:/data

volumes:
  sincrohub_postgres:
  sincrohub_redis:
